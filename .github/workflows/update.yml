name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 4-10 * * 1-5"   # market 30 min : roj 9:50 AM te 3:50 PM IST, Mon-Fri, pratyek 1 tasa
    - cron: "50 11 * * 1-5"     # market band jhalyavar 5:20 PM IST

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas tradingview-screener
      - run: python fetch_data.py
      - name: Publish data.json to the "data" branch (history never grows)
        run: |
          mkdir /tmp/pub && cp data.json /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -q -m "Update data"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
