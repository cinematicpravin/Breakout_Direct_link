name: Update data

on:
  workflow_dispatch:        # manual "Run workflow" button
  schedule:
    - cron: "50 11 * * 1-5" # ~5:20 PM IST, Mon-Fri

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas tradingview-screener
      - run: python fetch_data.py
      - name: Publish data.json to the "data" branch (history never grows)
        run: |
          mkdir /tmp/pub && cp data_d.json data_w.json data_m.json /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_d.json data_w.json data_m.json
          git commit -q -m "Update data"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
